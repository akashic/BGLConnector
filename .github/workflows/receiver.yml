# Builds and tests the BGL webhook receiver (bgl-spike/receiver) on pushes and pull requests that touch it, and
# deploys it to Azure only when run by hand (Actions -> Receiver -> Run workflow, with "deploy" ticked).
# Deployment uses OIDC (no stored secrets): run bgl-spike/receiver/scripts/Setup-GitHubOidc.ps1 first (runbook Part D).
name: Receiver

on:
  push:
    paths:
      - 'bgl-spike/receiver/**'
      - '.github/workflows/receiver.yml'
  pull_request:
    paths:
      - 'bgl-spike/receiver/**'
      - '.github/workflows/receiver.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the dev environment after building
        type: boolean
        default: false
      t17:
        description: T17 simulator settings (rejection reasons in responses, client code 'spike'). Untick before T12.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bgl-spike/receiver
    steps:
      # Actions are pinned to commit SHAs; the comment gives the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Latest patched 10.0 SDK; global.json (rollForward: latestFeature) pins the major version.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/BglWebhookReceiver.Tests/BglWebhookReceiver.Tests.csproj --configuration Release

      - name: Publish
        run: >
          dotnet publish src/BglWebhookReceiver/BglWebhookReceiver.csproj
          --configuration Release
          --runtime linux-x64 --self-contained false
          -p:SourceRevisionId=${{ github.sha }}
          --output publish

      - name: Package
        run: cd publish && zip -qr ../receiver.zip .

      - name: Lint Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for f in infra/env/*.bicepparam; do az bicep build-params --file "$f" --stdout > /dev/null; done

      # Also used by the laptop deployment (runbook Part D), so a machine without the .NET SDK can deploy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receiver
          path: bgl-spike/receiver/receiver.zip
          retention-days: 30

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: deploy-receiver-dev
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC token for azure/login
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PARAMETERS: bgl-spike/receiver/infra/env/dev.bicepparam
      T17: ${{ inputs.t17 }}
      # BGL's real client code, once T12 shows it. A secret, so the public run logs mask it.
      CLIENT_CODE: ${{ secrets.BGL_EXPECTED_CLIENT_CODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: receiver

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # dev.bicepparam keeps rejection reasons off and the client code empty. T17 overrides both with simulator values;
      # otherwise BGL's client code comes from the environment secret. (Repeated in the next step: arrays don't
      # survive between steps.)
      - name: What-if
        run: |
          overrides=()
          if [[ "$T17" == "true" ]]; then overrides=(--parameters exposeRejectionReason=true expectedClientCode=spike)
          elif [[ -n "$CLIENT_CODE" ]]; then overrides=(--parameters "expectedClientCode=$CLIENT_CODE"); fi
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --parameters "$PARAMETERS" "${overrides[@]}" \
            --result-format ResourceIdOnly

      - name: Deploy infrastructure
        id: infra
        run: |
          overrides=()
          if [[ "$T17" == "true" ]]; then overrides=(--parameters exposeRejectionReason=true expectedClientCode=spike)
          elif [[ -n "$CLIENT_CODE" ]]; then overrides=(--parameters "expectedClientCode=$CLIENT_CODE"); fi
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "bglhook-${{ github.run_number }}" \
            --parameters "$PARAMETERS" "${overrides[@]}" \
            --query properties.outputs --output json)
          echo "functionAppName=$(jq -r .functionAppName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "hostName=$(jq -r .functionAppHostName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "keyVaultName=$(jq -r .keyVaultName.value <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Deploy code
        run: >
          az functionapp deployment source config-zip
          --resource-group "$RESOURCE_GROUP"
          --name "${{ steps.infra.outputs.functionAppName }}"
          --src receiver.zip

      # Fails if allowedIpRanges excludes GitHub's runners: the health check is on the restricted main site.
      - name: Smoke test
        env:
          APP: ${{ steps.infra.outputs.functionAppName }}
          HOST: ${{ steps.infra.outputs.hostName }}
        run: |
          # Wait for the new build (identified by commit SHA in its version) to be serving. Health needs a key; the host
          # key works for every function, and it's sent as a header so it never needs URL-encoding.
          for i in $(seq 1 20); do
            hostKey=$(az functionapp keys list -g "$RESOURCE_GROUP" -n "$APP" --query functionKeys.default -o tsv 2>/dev/null || true)
            [[ -n "$hostKey" ]] && echo "::add-mask::$hostKey"
            health=$(curl -fsS -H "x-functions-key: $hostKey" "https://$HOST/api/health" || echo '{}')
            version=$(jq -r '.version // empty' <<< "$health")
            if [[ "$version" == *"${{ github.sha }}"* ]]; then echo "Serving: $health"; break; fi
            echo "Waiting for new version (got '$version')"; sleep 15
          done
          [[ "$version" == *"${{ github.sha }}"* ]] || { echo "::error::New version did not come up"; exit 1; }

          # Without a key the platform must refuse both endpoints before the code runs.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$HOST/api/bgl/webhook" -d '{}')
          [[ "$code" == "401" ]] || { echo "::error::Expected 401 without a function key, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/api/health")
          [[ "$code" == "401" ]] || { echo "::error::Expected 401 for health without a key, got $code"; exit 1; }

          # With the key but no signature the code must refuse it: 401, or 500 while the secret isn't set yet.
          key=$(az functionapp function keys list -g "$RESOURCE_GROUP" -n "$APP" --function-name BglWebhook --query default -o tsv)
          echo "::add-mask::$key"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "x-functions-key: $key" "https://$HOST/api/bgl/webhook" -d '{}')
          if [[ "$(jq -r .secretConfigured <<< "$health")" == "true" ]]; then
            [[ "$code" == "401" ]] || { echo "::error::Expected 401 for an unsigned call, got $code"; exit 1; }
          else
            [[ "$code" == "500" ]] || { echo "::error::Expected 500 (secret not set) for an unsigned call, got $code"; exit 1; }
            echo "::warning::bgl-webhook-secret is not set in Key Vault ${{ steps.infra.outputs.keyVaultName }} yet (runbook Part D, step D4)."
          fi

      - name: Summary
        run: |
          {
            echo "### Receiver deployed to dev"
            echo "- Function app: \`${{ steps.infra.outputs.functionAppName }}\`"
            echo "- Receiver URL (append \`?code=<function key>\` before registering with BGL): \`https://${{ steps.infra.outputs.hostName }}/api/bgl/webhook\`"
            echo "- Key Vault: \`${{ steps.infra.outputs.keyVaultName }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
